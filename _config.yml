# Site Settings
title: Jerrick Hoang
tagline: Notes on ML, LLMs, and robotics
description: Personal blog of Jerrick Hoang - ML/Robotics Engineer writing notes on machine learning, LLMs, and robotics.
url: https://jerrickhoang.github.io
baseurl: ""
lang: en

# Author
author:
  name: Jerrick Hoang
  email: jerrickhoang@gmail.com
  twitter: jerrick93

# SEO / social (used by jekyll-seo-tag for meta tags + JSON-LD)
twitter:
  username: jerrick93
  card: summary
social:
  name: Jerrick Hoang
  links:
    - https://github.com/jerrickhoang
    - https://twitter.com/jerrick93
    - https://scholar.google.com/citations?user=jXxwlbMAAAAJ

# Google Search Console verification (jekyll-seo-tag reads this automatically).
google_site_verification: "Jv8jdD-mTihOQwgNImSlvQdn-3jwu5B-MzZpqONPe90"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
timezone: America/Los_Angeles

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude
exclude:
  - AUTHORING_NOTES.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  categories:
    output: true
  tags:
    output: true

