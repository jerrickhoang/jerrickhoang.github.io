---
layout: default
---

<article class="post-container">
  <nav class="post-toc" id="post-toc" aria-label="Table of contents"></nav>

  <a href="{{ '/' | relative_url }}" class="back-link">← Back to Home</a>
  
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
      {% if page.category %}
        <a href="{{ '/categories' | relative_url }}/#{{ page.category | downcase | replace: ' ', '-' }}" class="category-tag">{{ page.category }}</a>
      {% endif %}
    </div>
    {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}
          <a href="{{ '/tags' | relative_url }}/#{{ tag | downcase | replace: ' ', '-' }}" class="tag">#{{ tag }}</a>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.post-content');
    var toc = document.getElementById('post-toc');
    if (!content || !toc) return;

    var headings = content.querySelectorAll('h1, h2, h3');
    if (headings.length < 2) { toc.style.display = 'none'; return; }

    var minLevel = Math.min.apply(null, Array.prototype.map.call(headings, function (h) {
      return parseInt(h.tagName.charAt(1), 10);
    }));

    var title = document.createElement('div');
    title.className = 'toc-title';
    title.textContent = 'On this page';
    toc.appendChild(title);

    var list = document.createElement('ul');
    list.className = 'toc-list';
    var links = {};

    headings.forEach(function (h) {
      if (!h.id) {
        h.id = h.textContent.trim().toLowerCase().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '');
      }
      var li = document.createElement('li');
      li.className = 'toc-item toc-depth-' + (parseInt(h.tagName.charAt(1), 10) - minLevel);
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      list.appendChild(li);
      links[h.id] = a;
    });
    toc.appendChild(list);

    var visible = new Set();
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { visible.add(e.target.id); }
        else { visible.delete(e.target.id); }
      });
      var current = null;
      headings.forEach(function (h) {
        if (current === null && visible.has(h.id)) { current = h.id; }
      });
      if (current === null) { return; }
      Object.keys(links).forEach(function (id) {
        links[id].classList.toggle('active', id === current);
      });
    }, { rootMargin: '-90px 0px -75% 0px', threshold: 0 });

    headings.forEach(function (h) { observer.observe(h); });
  });
</script>
