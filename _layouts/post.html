---
layout: default
---

<article class="post-container">
  <a href="{{ '/' | relative_url }}" class="back-link">← Back to Home</a>
  
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
      {% if page.category %}
        <a href="{{ '/categories' | relative_url }}/#{{ page.category | downcase | replace: ' ', '-' }}" class="category-tag">{{ page.category }}</a>
      {% endif %}
    </div>
    {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}
          <a href="{{ '/tags' | relative_url }}/#{{ tag | downcase | replace: ' ', '-' }}" class="tag">#{{ tag }}</a>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
