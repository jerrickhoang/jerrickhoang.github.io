<header class="header">
  <nav class="nav">
    <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
      <a href="{{ '/about' | relative_url }}" class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a>
      <a href="{{ '/categories' | relative_url }}" class="nav-link {% if page.url contains '/categories' %}active{% endif %}">Categories</a>
      <a href="{{ '/tags' | relative_url }}" class="nav-link {% if page.url contains '/tags' %}active{% endif %}">Tags</a>
      <a href="{{ '/archives' | relative_url }}" class="nav-link {% if page.url contains '/archives' %}active{% endif %}">Archives</a>
    </div>
  </nav>
</header>
