<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>
  <text x="310" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The GPU memory hierarchy</text>

  <!-- pyramid trapezoids (cx = 310) -->
  <!-- Registers -->
  <polygon points="235,70 385,70 431,160 189,160" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <text x="310" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Registers</text>
  <text x="310" y="128" text-anchor="middle" font-size="12" fill="#166534">256 KB / SM - single-cycle - per-thread</text>

  <!-- SMEM / L1 -->
  <polygon points="189,160 431,160 477,250 143,250" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
  <text x="310" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">SMEM / L1</text>
  <text x="310" y="218" text-anchor="middle" font-size="12" fill="#92400e">256 KB / SM - ~10x HBM BW - programmer-managed</text>

  <!-- L2 -->
  <polygon points="143,250 477,250 524,340 96,340" fill="#fdba74" stroke="#ea580c" stroke-width="1.4"/>
  <text x="310" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">L2 cache</text>
  <text x="310" y="308" text-anchor="middle" font-size="12" fill="#9a3412">~50 MB - shared - ~5 TB/s - hardware-managed</text>

  <!-- HBM -->
  <polygon points="96,340 524,340 570,430 50,430" fill="#fca5a5" stroke="#dc2626" stroke-width="1.4"/>
  <text x="310" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">HBM (main memory)</text>
  <text x="310" y="398" text-anchor="middle" font-size="12" fill="#991b1b">80 GB - ~3.35 TB/s - off-chip</text>

  <!-- left axis arrow -->
  <line x1="30" y1="425" x2="30" y2="72" stroke="#64748b" stroke-width="1.8" marker-end="url(#ahl)"/>
  <text x="20" y="150" text-anchor="middle" font-size="12.5" fill="#475569" transform="rotate(-90 20 150)">faster, smaller</text>
  <text x="20" y="360" text-anchor="middle" font-size="12.5" fill="#475569" transform="rotate(-90 20 360)">bigger, slower</text>

  <!-- callout A: working set -->
  <line x1="600" y1="150" x2="455" y2="205" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="600" y="88" width="248" height="118" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="612" y="112" font-size="12.5" font-weight="700" fill="#14532d">Flash Attention's working set</text>
  <text x="612" y="134" font-size="12" fill="#166534">Q/K/V tiles + the running</text>
  <text x="612" y="152" font-size="12" fill="#166534">softmax stats (m, l) and the</text>
  <text x="612" y="170" font-size="12" fill="#166534">output accumulator O stay</text>
  <text x="612" y="188" font-size="12" fill="#166534">up here, in SMEM + registers.</text>

  <!-- callout B: HBM bottleneck -->
  <line x1="600" y1="388" x2="548" y2="388" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="600" y="330" width="248" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="612" y="354" font-size="12.5" font-weight="700" fill="#7f1d1d">The naive bottleneck</text>
  <text x="612" y="376" font-size="12" fill="#991b1b">Naive attention writes the</text>
  <text x="612" y="394" font-size="12" fill="#991b1b">N x N scores here, then reads</text>
  <text x="612" y="412" font-size="12" fill="#991b1b">them back - twice.</text>
</svg>
