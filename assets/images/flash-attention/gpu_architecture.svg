<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">How a GPU is laid out</text>

  <!-- GPU die -->
  <rect x="20" y="50" width="820" height="320" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="36" y="72" font-size="14" font-weight="700" fill="#475569">GPU die (H100: 132 SMs)</text>

  <!-- SM boxes -->
  <g>
    <!-- SM 1 -->
    <rect x="40" y="85" width="230" height="200" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="155" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">SM 1</text>
    <rect x="52" y="112" width="206" height="38" rx="6" fill="#c7d2fe"/>
    <text x="155" y="136" text-anchor="middle" font-size="12.5" fill="#312e81">Tensor Core (matmul)</text>
    <rect x="52" y="155" width="206" height="38" rx="6" fill="#ddd6fe"/>
    <text x="155" y="179" text-anchor="middle" font-size="12.5" fill="#312e81">4x warp scheduler + CUDA cores</text>
    <rect x="52" y="198" width="206" height="38" rx="6" fill="#bbf7d0"/>
    <text x="155" y="222" text-anchor="middle" font-size="12.5" fill="#14532d">SMEM / L1 - 256 KB</text>
    <rect x="52" y="241" width="206" height="38" rx="6" fill="#bfdbfe"/>
    <text x="155" y="265" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Registers - 256 KB</text>

    <!-- SM 2 -->
    <rect x="305" y="85" width="230" height="200" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="420" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">SM 2</text>
    <rect x="317" y="112" width="206" height="38" rx="6" fill="#c7d2fe"/>
    <text x="420" y="136" text-anchor="middle" font-size="12.5" fill="#312e81">Tensor Core (matmul)</text>
    <rect x="317" y="155" width="206" height="38" rx="6" fill="#ddd6fe"/>
    <text x="420" y="179" text-anchor="middle" font-size="12.5" fill="#312e81">4x warp scheduler + CUDA cores</text>
    <rect x="317" y="198" width="206" height="38" rx="6" fill="#bbf7d0"/>
    <text x="420" y="222" text-anchor="middle" font-size="12.5" fill="#14532d">SMEM / L1 - 256 KB</text>
    <rect x="317" y="241" width="206" height="38" rx="6" fill="#bfdbfe"/>
    <text x="420" y="265" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Registers - 256 KB</text>

    <!-- dots -->
    <text x="552" y="190" text-anchor="middle" font-size="26" font-weight="700" fill="#94a3b8">...</text>

    <!-- SM 132 -->
    <rect x="570" y="85" width="230" height="200" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="685" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">SM 132</text>
    <rect x="582" y="112" width="206" height="38" rx="6" fill="#c7d2fe"/>
    <text x="685" y="136" text-anchor="middle" font-size="12.5" fill="#312e81">Tensor Core (matmul)</text>
    <rect x="582" y="155" width="206" height="38" rx="6" fill="#ddd6fe"/>
    <text x="685" y="179" text-anchor="middle" font-size="12.5" fill="#312e81">4x warp scheduler + CUDA cores</text>
    <rect x="582" y="198" width="206" height="38" rx="6" fill="#bbf7d0"/>
    <text x="685" y="222" text-anchor="middle" font-size="12.5" fill="#14532d">SMEM / L1 - 256 KB</text>
    <rect x="582" y="241" width="206" height="38" rx="6" fill="#bfdbfe"/>
    <text x="685" y="265" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Registers - 256 KB</text>
  </g>

  <!-- L2 cache -->
  <rect x="40" y="305" width="760" height="46" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
  <text x="420" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">L2 cache - ~50 MB - shared by all SMs - ~5 TB/s</text>

  <!-- arrow die <-> HBM -->
  <line x1="430" y1="371" x2="430" y2="409" stroke="#334155" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="446" y="394" font-size="12.5" fill="#334155">off-chip: every access is slow</text>

  <!-- HBM -->
  <rect x="20" y="410" width="820" height="70" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">HBM - off-chip main memory</text>
  <text x="430" y="462" text-anchor="middle" font-size="13.5" fill="#991b1b">80 GB - ~3.35 TB/s (this is where the N x N matrix would live)</text>
</svg>
